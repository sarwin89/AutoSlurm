[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autoslurm"
version = "0.2.0"
description = "Lightweight workflow runner for DFT jobs on SLURM clusters"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
autoslurm = "autoslurm.cli:main"

[tool.setuptools.packages.find]
include = ["autoslurm*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
