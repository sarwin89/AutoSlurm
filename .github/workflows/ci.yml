name: CI

on:
  push:
    branches:
      - main
      - codex/autoslurm-milestone
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Check legacy shell syntax
        shell: bash
        run: |
          for script in autoslurm-cli.sh launch.sh setup-check.sh reset-run.sh submit.sh submit-cpu.sh; do
            bash -n "$script"
          done

      - name: Run tests
        run: pytest -q
